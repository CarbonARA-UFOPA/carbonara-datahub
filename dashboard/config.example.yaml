# config.example.yaml — copie para config.yaml e ajuste.
# Este arquivo é a fonte de verdade do dashboard e é EDITADO PELA PRÓPRIA UI
# (cadastro de estações e arquivos). Pode também ser editado à mão.

server:
  host: 0.0.0.0
  port: 8080
  refresh_seconds: 60        # auto-atualização das páginas e gráficos

# Raiz de dados do hub — /srv/carbonara em produção. Caminho RELATIVO é resolvido
# contra a pasta deste config (../data = ./data na raiz do repositório, em dev).
data_root: ../data
# Log de conexões do rsync-hub (enriquece o status "Recebendo dados").
# null = <data_root>/log/connections.log
connections_log: null
# Janela de offline (s) para estações SEM heartbeat válido (espelha RSYNC_HUB_STALE).
stale_fallback_seconds: 3600

# Gerenciamento da coleta (página "Coleta", só admin): a dashboard executa o PRÓPRIO
# rsync-hub para autorizar/revogar estações. null = procura /usr/local/bin/rsync-hub
# e o PATH. As escritas rodam via "sudo -n" — libere no sudoers (visudo):
#   <usuario-da-dashboard> ALL=(root) NOPASSWD: /usr/local/bin/rsync-hub add *, \
#       /usr/local/bin/rsync-hub remove *, /usr/local/bin/rsync-hub pause *, \
#       /usr/local/bin/rsync-hub resume *
# (o jeito fácil é rodar dashboard/setup-hub-access.sh, que gera a regra completa)
# Sem a regra, a página degrada para somente leitura (listar/credenciais/downloads).
rsync_hub_bin: null

# Fuso para EXIBIR o "último sinal" (só a exibição; o cálculo online/offline usa epoch,
# imune a fuso). Útil quando o processo da dashboard roda em UTC e o servidor está em
# outro fuso — defina o nome IANA do seu fuso para ver a hora local correta.
# null/omitido = usa o fuso do processo.
# timezone: America/Santarem

# Login de administração: a VISUALIZAÇÃO é aberta; EDITAR (cadastrar/remover) exige
# login. Sem este bloco, a edição fica liberada (modo desenvolvimento).
# Gere o hash com:
#   python -c "from werkzeug.security import generate_password_hash; print(generate_password_hash('SUA-SENHA'))"
# auth:
#   username: carbonara
#   password_hash: "scrypt:...cole o hash aqui..."

stations:
  - id: flona01
    name: "FLONA Tapajós 01"
    # Coordenadas geográficas (WGS84, graus decimais; sul/oeste negativos).
    # Necessárias para a estação aparecer na página Mapa; opcionais no restante.
    latitude: -3.578041
    longitude: -55.074330
    # Watchdog: arquivo de heartbeat que a ESTAÇÃO envia. O status usa o mtime dele +
    # o interval_min do conteúdo (janela = 2×intervalo + 2 min, igual ao
    # `rsync-hub monitor`). Não há override de janela por estação: a cadência é
    # decidida no cliente (tempo de reciclagem).
    # null = <data_root>/incoming/flona01/.carbonara-status (padrão). Só preencha em
    # instalação fora do padrão — a interface não edita este campo.
    heartbeat_file: null
    files:
      - id: dados30min
        path: incoming/flona01/flona01.dat   # relativo a data_root, ou absoluto
        # Arquivo que rotaciona pelo relógio? Escreva o caminho como padrão strftime e
        # marque dynamic_path: o dashboard resolve a cada leitura com a data DO
        # SERVIDOR, seguindo sozinho o arquivo do dia/hora. Se o do momento ainda não
        # chegou, lê o mais recente que casa com o padrão; se nenhum existe, a tela
        # avisa em tom neutro e não plota (não é erro).
        #   path: incoming/flona01/torre/%Y-%m-%d__02-29-52.sfo
        #   dynamic_path: true
        tail_lines: 288                       # 288 × 30min = últimos ~6 dias
        separator: ","                        # "," · "\t" (tab) · " " (espaço)
        # Separador ESPAÇO divide por sequências de espaço/tab: espaços repetidos de
        # alinhamento não viram colunas vazias (no formulário escreva \s).
        quotechar: '"'                        # TOA5 (Campbell) usa aspas; "" (vazio) =
                                              #   ignora aspas e divide os campos entre
                                              #   aspas pelas vírgulas internas (mapeie
                                              #   por índice — os nomes deixam de alinhar)
        decimal: "."
        # strip_regex (opcional): apaga de cada VALOR os trechos casados antes de virar
        # número (não mexe no timestamp). Ex.: "[A-Za-z]" tira o 'm' de "m -125";
        # "[^0-9.,+-]" deixa só número/sinal. Útil com quotechar:"" para limpar strings.
        # strip_regex: "[A-Za-z]"
        skip_header_lines: 1                  # TOA5 = 4 · CSV com cabeçalho = 1
        header_line: 1                        # linha (1-based) com nomes; TOA5 = 2; null = sem nomes
        timestamp:
          column: 0                           # índice OU nome de coluna (qualquer uma)
          format: "%Y-%m-%d %H:%M:%S"
          # Carimbo em Unix epoch (segundos desde 1970-01-01 UTC)? Use:
          #   format: epoch
          # Aceita fração ("1787542188.433029" = precisão de microssegundo) e valores
          # em ms/µs/ns (a escala é deduzida pela ordem de grandeza).
        variables:                            # um gráfico por variável
          # type (opcional, padrão "numero"): numero · inteiro · booleano · epoch ·
          # texto. "epoch" é para OUTRAS colunas de carimbo do arquivo (a linha mostra
          # quando aquele bloco avançou, exibida como hora); "texto" não vira gráfico,
          # a tela mostra o último valor lido.
          # min/max (opcionais) = limites FÍSICOS plausíveis: viram linhas de marcação
          # no gráfico e os trechos fora deles ficam vermelhos (dado bom vs. ruim).
          - { column: 1,         label: "Temperatura do ar", unit: "°C",  min: -10, max: 50 }
          - { column: "RH",      label: "Umidade relativa",  unit: "%",   min: 0,   max: 100 }
          - { column: "CO2_Avg", label: "CO2",               unit: "ppm", min: 250, max: 1000 }
