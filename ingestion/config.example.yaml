# config.example.yaml — copie para config.yaml e ajuste.
# Mapeia cada estação ao seu parser e define os diretórios de trabalho.

# Diretórios (dentro do container; mapeados por volume no docker-compose.yml).
paths:
  landing: /data/landing
  archive: /data/archive
  quarantine: /data/quarantine

poll_seconds: 30      # de quanto em quanto tempo varrer o landing/
settle_seconds: 5     # idade mínima (s) do arquivo antes de processar (evita upload parcial)

# Parser usado quando a estação não tem entrada específica abaixo.
default_parser:
  parser: csv_generic
  options:
    timestamp_column: "TIMESTAMP"
    timestamp_format: "%Y-%m-%d %H:%M:%S"
    timezone: "America/Santarem"
    delimiter: ","
    columns:                 # coluna do CSV  ->  variable_id no banco
      AirTC_Avg: air_temp
      RH: rel_humidity
      BP_hPa_Avg: pressure
      WS_ms_Avg: wind_speed
      WindDir: wind_dir
      Rain_mm_Tot: rainfall

# Configuração por estação (sobrepõe o default). Use quando o formato variar.
stations:
  flona01:
    parser: csv_generic
    options:
      timestamp_column: "TIMESTAMP"
      timestamp_format: "%Y-%m-%d %H:%M:%S"
      timezone: "America/Santarem"
      columns:
        AirTC_Avg: air_temp
        RH: rel_humidity
        Rain_mm_Tot: rainfall
        CO2_Avg: co2
