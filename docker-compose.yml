# docker-compose.yml — serviços centrais do CARBONARA na workstation.
# Sobe: (1) TimescaleDB, (2) serviço de ingestão, (3) FTP de distribuição (read-only).
# A COLETA das estações NÃO é feita aqui: é rsync-over-SSH nativo no host, pelo script
# `rsync-hub` (que também monitora as conexões). O FTP virou só ponto de saída.
# Uso: cp .env.example .env && docker compose up -d
#
# CARBONARA_ROOT (default ./data em dev; /srv/carbonara em produção, onde o rsync-hub
# escreve incoming/) é a raiz dos volumes de dados, compartilhada entre os serviços.

name: carbonara-server

services:
  # ---------------------------------------------------------------------------
  # FTP/FTPS de DISTRIBUIÇÃO (read-only) — NÃO recebe mais dados das estações.
  # A coleta agora é rsync-over-SSH (ver rsync-hub). Aqui o FTP só disponibiliza os
  # dados já processados (archive/) para consumidores; monta archive/ como read-only.
  # ---------------------------------------------------------------------------
  ftp:
    image: stilliard/pure-ftpd:hardened
    container_name: carbonara-ftp
    restart: unless-stopped
    ports:
      - "${FTP_PORT:-21}:21"
      - "${FTP_PASV_PORT_RANGE:-30000-30009}:30000-30009"
    environment:
      PUBLICHOST: "${FTP_PUBLIC_HOST:-localhost}"
      FTP_USER_NAME: "${FTP_USER_NAME:-carbonara}"
      FTP_USER_PASS: "${FTP_USER_PASS:?defina FTP_USER_PASS no .env}"
      FTP_USER_HOME: /home/ftpusers/carbonara
      FTP_PASSIVE_PORTS: "${FTP_PASV_PORT_RANGE:-30000:30009}"
      ADDED_FLAGS: "--tls=1"            # exige TLS (FTPS); ver ftp/README.md p/ cert
    volumes:
      # Distribuição: expõe os dados processados como somente-leitura (sem upload).
      - ${CARBONARA_ROOT:-./data}/archive:/home/ftpusers/carbonara:ro
      - ./ftp/tls:/etc/ssl/private:ro  # coloque o pure-ftpd.pem aqui (ver ftp/README.md)
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -ltn | grep -q ':21 '"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Banco de dados — PostgreSQL + TimescaleDB. Roda os scripts de init/ no 1º start.
  # ---------------------------------------------------------------------------
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: carbonara-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "${DB_USER:?defina DB_USER no .env}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?defina DB_PASSWORD no .env}"
      POSTGRES_DB: "${DB_NAME:-carbonara}"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro   # 01_/02_/03_*.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-carbonara}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Serviço de ingestão — observa incoming/, faz parse e carrega no TimescaleDB.
  # Só conhece o diretório onde os arquivos pousam; é independente de COMO chegaram
  # (rsync-over-SSH hoje). incoming/ é mapeado para /data/landing dentro do container.
  # ---------------------------------------------------------------------------
  ingestion:
    build: ./ingestion
    container_name: carbonara-ingestion
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME:-carbonara}"
      INGEST_POLL_SECONDS: "${INGEST_POLL_SECONDS:-30}"
    volumes:
      - ${CARBONARA_ROOT:-./data}/incoming:/data/landing
      - ${CARBONARA_ROOT:-./data}/archive:/data/archive
      - ${CARBONARA_ROOT:-./data}/quarantine:/data/quarantine
      - ./ingestion/config.yaml:/app/config.yaml:ro

# A coleta (rsync-over-SSH) e o monitor rodam NATIVOS no host, pelo script `rsync-hub`
# (não são serviços do compose). Ver rsync-hub e o README.

volumes:
  db_data:
