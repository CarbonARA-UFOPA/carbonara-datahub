# docker-compose.yml — serviços centrais do CARBONARA na workstation.
# Sobe: (1) servidor FTP/FTPS, (2) TimescaleDB, (3) serviço de ingestão.
# Uso: cp .env.example .env && docker compose up -d
#
# Os caminhos de dados (landing/archive/quarantine) são montados como volumes para
# persistirem fora dos containers e serem compartilhados entre FTP e ingestão.

name: carbonara-server

services:
  # ---------------------------------------------------------------------------
  # Servidor FTP/FTPS — ponto único onde as estações concentram os arquivos.
  # Cada estação usa um usuário FTP apontando para landing/<station_id>/.
  # ---------------------------------------------------------------------------
  ftp:
    image: stilliard/pure-ftpd:hardened
    container_name: carbonara-ftp
    restart: unless-stopped
    ports:
      - "${FTP_PORT:-21}:21"
      - "${FTP_PASV_PORT_RANGE:-30000-30009}:30000-30009"
    environment:
      PUBLICHOST: "${FTP_PUBLIC_HOST:-localhost}"
      FTP_USER_NAME: "${FTP_USER_NAME:-carbonara}"
      FTP_USER_PASS: "${FTP_USER_PASS:?defina FTP_USER_PASS no .env}"
      FTP_USER_HOME: /home/ftpusers/carbonara
      FTP_PASSIVE_PORTS: "${FTP_PASV_PORT_RANGE:-30000:30009}"
      ADDED_FLAGS: "--tls=1"            # exige TLS (FTPS); ver server/ftp/README.md p/ cert
    volumes:
      - ./data/landing:/home/ftpusers/carbonara
      - ./ftp/tls:/etc/ssl/private:ro  # coloque o pure-ftpd.pem aqui (ver server/ftp/README.md)
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -ltn | grep -q ':21 '"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Banco de dados — PostgreSQL + TimescaleDB. Roda os scripts de init/ no 1º start.
  # ---------------------------------------------------------------------------
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: carbonara-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "${DB_USER:?defina DB_USER no .env}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?defina DB_PASSWORD no .env}"
      POSTGRES_DB: "${DB_NAME:-carbonara}"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro   # 01_/02_/03_*.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-carbonara}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Serviço de ingestão — observa landing/, faz parse e carrega no TimescaleDB.
  # Só conhece o diretório de pouso; é independente de COMO o arquivo chegou.
  # ---------------------------------------------------------------------------
  ingestion:
    build: ./ingestion
    container_name: carbonara-ingestion
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME:-carbonara}"
      INGEST_POLL_SECONDS: "${INGEST_POLL_SECONDS:-30}"
    volumes:
      - ./data/landing:/data/landing
      - ./data/archive:/data/archive
      - ./data/quarantine:/data/quarantine
      - ./ingestion/config.yaml:/app/config.yaml:ro

volumes:
  db_data:
