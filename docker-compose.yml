# docker-compose.yml — serviços de DADOS do CARBONARA na workstation.
# Sobe: (1) db — PostgreSQL 16 + TimescaleDB + PostGIS, no disco de dados;
#       (2) ingestion — ingestão INCREMENTAL dirigida pelos arquivos monitorados na
#           dashboard (lê a raiz de dados somente leitura; nunca move nada);
#       (3) api — API de dados (FastAPI) na porta API_PORT (8000), com chaves de acesso.
# NÃO estão aqui: a coleta (rsync-hub, nativo), a dashboard (Flask, nativa) e o FTP de
# distribuição (vsftpd nativo — docs/ftp-native-install.md).
#
# Uso: sudo ./database/setup-db-host.sh   (uma vez: Docker no disco de dados + .env)
#      docker compose up -d --build
#      ./database/migrate.sh              (schema num banco já existente)
#
# ONDE ESTÁ O BANCO (.env, editável em Banco → Conexão na dashboard):
#   DB_HOST=db + COMPOSE_PROFILES=local-db  → banco local, neste compose (padrão)
#   DB_HOST=<ip> + DB_INTERNAL_PORT=<porta> + COMPOSE_PROFILES=   → banco em outro servidor
#
# CARBONARA_ROOT (caminho ABSOLUTO — em produção a raiz do rsync-hub, onde chega
# incoming/; em dev, o ./data do repositório por extenso) é montada no MESMO caminho dentro dos containers — os caminhos absolutos do
# config.yaml da dashboard (heartbeat_file, files[].path) valem sem tradução.
# PG_DATA_DIR é o diretório do cluster no disco de dados (bind mount, fora do disco root).

name: carbonara-server

services:
  # ---------------------------------------------------------------------------
  # Banco de dados — PostgreSQL 16 + TimescaleDB + PostGIS. Roda database/init/* no
  # PRIMEIRO start (diretório do cluster vazio): 01_/02_/03_*.sql, 04_replication.sh e
  # 05_migrations.sh (aplica database/migrations/ — o mesmo que migrate.sh aplica num
  # banco existente). Imagem FIXADA (não `latest`).
  # Só escuta em DB_BIND (127.0.0.1): ingestão e API falam com ele pela rede do compose;
  # um espelho futuro entra liberando a porta para o IP dele.
  # Memória dimensionada para o host de 7,6 GB (docs/estrategia-dados.md, 2.6).
  # ---------------------------------------------------------------------------
  db:
    # Perfil `local-db` (ligado por COMPOSE_PROFILES=local-db no .env): quando o banco for
    # migrado para outro servidor, basta esvaziar COMPOSE_PROFILES e apontar DB_HOST —
    # ingestão e API continuam iguais (elas esperam o banco ficar acessível).
    profiles: ["local-db"]
    image: timescale/timescaledb-ha:pg16.15-ts2.30.1
    container_name: carbonara-db
    restart: unless-stopped
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "${DB_USER:?defina DB_USER no .env}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?defina DB_PASSWORD no .env}"
      POSTGRES_DB: "${DB_NAME:-carbonara}"
      REPLICATION_PASSWORD: "${REPLICATION_PASSWORD:-}"
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      # memória (host de 7,6 GB compartilhado com dashboard, ingestão e API)
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1536MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=40
      - -c
      - max_worker_processes=8
      - -c
      - max_parallel_workers=2
      - -c
      - timescaledb.max_background_workers=4
      # pronto para o espelho (streaming replication) — ver database/init/04_replication.sh
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=3
      - -c
      - max_replication_slots=3
      - -c
      - wal_keep_size=2GB
      # o banco guarda e mostra UTC; o fuso de cada arquivo é tratado na ingestão
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
    volumes:
      - ${PG_DATA_DIR:-./data/pgdata}:/home/postgres/pgdata/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/migrations:/migrations:ro
    shm_size: 512m
    mem_limit: ${DB_MEM_LIMIT:-3g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-carbonara}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Ingestão — lê SÓ os arquivos com "Ingerir no banco" marcado na dashboard (e só as
  # variáveis registradas), de forma incremental por offset, aplica o QC e grava no
  # banco. A raiz de dados entra SOMENTE LEITURA: por construção este serviço não
  # consegue mover, apagar ou alterar um arquivo das estações.
  # Build context = raiz do repo (inclui processing/ e carbonara_parse/).
  # ---------------------------------------------------------------------------
  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: carbonara-ingestion
    restart: unless-stopped
    environment:
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_INTERNAL_PORT:-5432}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME:-carbonara}"
      INGEST_POLL_SECONDS: "${INGEST_POLL_SECONDS:-30}"
      INGEST_SETTLE_SECONDS: "${INGEST_SETTLE_SECONDS:-5}"
      INGEST_MAX_BYTES: "${INGEST_MAX_BYTES:-67108864}"
      INGEST_CHUNK_BYTES: "${INGEST_CHUNK_BYTES:-4194304}"
      INGEST_CYCLE_BUDGET_BYTES: "${INGEST_CYCLE_BUDGET_BYTES:-536870912}"
      DASHBOARD_CONFIG: /app/dashboard/config.yaml
      TZ: UTC
    mem_limit: ${INGEST_MEM_LIMIT:-1g}
    volumes:
      - ${CARBONARA_ROOT:?defina CARBONARA_ROOT no .env (caminho ABSOLUTO)}:${CARBONARA_ROOT}:ro
      # A PASTA da dashboard, não o arquivo: a dashboard salva o config.yaml de forma
      # atômica (temporário + rename), o que troca o inode — um bind mount de ARQUIVO
      # ficaria preso à versão antiga e a ingestão nunca veria registros novos.
      - ./dashboard:/app/dashboard:ro
      - ./processing/config.yaml:/app/processing/config.yaml:ro

  # ---------------------------------------------------------------------------
  # API de dados — FastAPI/uvicorn. Porta API_PORT no host (liberar no STI); acesso por
  # chave (X-API-Key). Primeira chave: docker compose exec api python -m app.keys_cli
  # create --owner dashboard --scopes read,admin
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: carbonara-api
    restart: unless-stopped
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8000}:8000"
    environment:
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_INTERNAL_PORT:-5432}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME:-carbonara}"
      API_KEY_PEPPER: "${API_KEY_PEPPER:?defina API_KEY_PEPPER no .env}"
      TZ: UTC
    mem_limit: ${API_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

# A coleta (rsync-over-SSH) e o monitor rodam NATIVOS no host, pelo script
# `collection/rsync-hub` (não são serviços do compose). Ver o README.
